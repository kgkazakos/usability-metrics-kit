[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usability-metrics-kit"
version = "0.1.0"
description = "Calculate, benchmark and narrate SUS, UMUX, SUPR-Q and the wider usability-metrics family."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kostas Kazakos" }]
keywords = ["ux-research", "usability", "sus", "umux", "supr-q", "nasa-tlx", "metrics"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
openai = ["dspy-ai>=2.5", "litellm>=1.40"]
anthropic = ["dspy-ai>=2.5", "litellm>=1.40"]
gemini = ["dspy-ai>=2.5", "litellm>=1.40"]
llm = ["dspy-ai>=2.5", "litellm>=1.40"]
ui = ["streamlit>=1.34", "pandas>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
umk = "usability_metrics_kit.cli:main"

[project.urls]
Homepage = "https://github.com/kgkazakos/usability-metrics-kit"
Source = "https://github.com/kgkazakos/usability-metrics-kit"

[tool.setuptools.packages.find]
include = ["usability_metrics_kit*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
